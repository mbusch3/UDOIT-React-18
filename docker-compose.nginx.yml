services:
  db:
    container_name: udoit3-db
    image: mysql:latest
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: udoit3
      MYSQL_USER: udoit
      MYSQL_PASSWORD: udoit
    ports:
      - "3306:3306"
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -proot']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  web:
      container_name: udoit3-web
      image: nginx:latest
      ports:
        - "8000:80"
      volumes:
        - .:/var/www/html
        - ./build/nginx/local.conf:/etc/nginx/conf.d/default.conf
      links:
          - php
      env_file:
        - .env
  node:
      container_name: udoit4-node
      build:
        context: ./server
        dockerfile: Dockerfile.node
      ports:
        - "3001:3001"
      environment:
        NODE_ENV: development
        MYSQL_HOST: db
        MYSQL_PORT: 3306
        MYSQL_DATABASE: udoit3
        MYSQL_USER: udoit
        MYSQL_PASSWORD: udoit
      depends_on:
        db:
          condition: service_healthy
  
  php:
      container_name: udoit3-php
      build:
        context: ./build/nginx
        dockerfile: Dockerfile.php.pdo.mysql
      volumes:
        - ./:/var/www/html
        - type: bind
          source: ./build/nginx/php-custom.ini
          target: /usr/local/etc/php/conf.d/php-custom.ini
      env_file:
        - .env
  composer:
      container_name: udoit3-composer
      build:
        context: ./build/nginx
        dockerfile: Dockerfile.composer
      command: >
        sh -c '
          if [ "$APP_ENV" = "dev" ]; then
            echo "composer install (dev)" &&
            composer install --no-interaction --no-progress --optimize-autoloader;
          else
            echo "composer install (prod)" &&
            composer install --no-dev --no-interaction --no-progress --optimize-autoloader;
          fi
        '
      volumes:
        - ./:/app
      env_file:
        - .env
  yarn:
      container_name: udoit3-yarn
      image: node:20
      volumes:
        - ./:/app
      env_file:
        - .env
      command: >
        bash -c '
        cd /app &&
        yarn install &&
        yarn watch'
  ace:
    container_name: udoit3-ace
    image: ghcr.io/ucfopen/equal-access-server:main
    ports:
      - "3000:3000"
    environment:
      - PORT=3000

volumes:
  web:
  dbdata:
